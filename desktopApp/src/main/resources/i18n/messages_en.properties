鼠标直拖模式：侧边栏选中的图层优先，按住画布任意位置拖动都会移动当前选区；没有选中时按住某个图层即可选中并直接移动。\n先选后拖模式与直拖相同，区别是没有选中时按住图层只选中、不移动。\n单击其它图层会改选它，单击空白处清空选择。\n中键或右键拖动：对应开关开启时平移整个表盘。\n滚轮：开关开启时可缩放光标下的选中元素；关闭后始终缩放整个表盘。\n自动吸附会在移动和变换时对齐画布及其他元素；变换控制点可显示八向缩放点和旋转拉杆；操作状态提示只用于显示耗时任务进度。\n空格 + 左键：临时拖动画布；按住 Ctrl 拖动图层会降低移动灵敏度并暂时关闭自动吸附；空白处按住 Ctrl 仍可临时平移画布；Ctrl + 滚轮：始终缩放整个表盘。=Direct-drag mode: the layer selected in the sidebar wins, so dragging anywhere on the canvas moves the current selection; with nothing selected, holding a layer selects and moves it in one step.\nSelect-then-drag behaves the same, except that with nothing selected, holding a layer only selects it.\nClicking another layer selects it; clicking empty space clears the selection.\nMiddle- or right-button drag pans the whole watch face when enabled.\nWheel: when enabled, resize the selected element under the cursor; otherwise always zoom the whole watch face.\nSnapping aligns moved and transformed elements to the canvas and each other. Transform handles show eight resize points and a rotation arm. Operation status is shown only for long-running tasks.\nSpace + left button temporarily pans the canvas; holding Ctrl while dragging a layer reduces movement sensitivity and temporarily disables snapping; holding Ctrl on empty canvas still pans temporarily; Ctrl + wheel always zooms the whole watch face.
鼠标直拖模式：侧边栏选中的图层优先，按住画布任意位置拖动都会移动当前选区；没有选中时按住某个图层即可选中并直接移动。\n先选后拖模式与直拖相同，区别是没有选中时按住图层只选中、不移动。\n单击其它图层会改选它，单击空白处清空选择。\n中键或右键拖动：对应开关开启时平移整个表盘。\n滚轮：开关开启时可缩放光标下的选中元素；关闭后始终缩放整个表盘。\n自动吸附会在移动和变换时对齐画布及其他元素；变换控制点可显示八向缩放点和旋转拉杆；操作状态提示只用于显示耗时任务进度。\n空格 + 左键或 Ctrl + 左键：临时拖动画布；Ctrl + 滚轮：始终缩放整个表盘。=Direct-drag mode: the layer selected in the sidebar wins, so dragging anywhere on the canvas moves the current selection; with nothing selected, holding a layer selects and moves it in one step.\nSelect-then-drag behaves the same, except that with nothing selected, holding a layer only selects it.\nClicking another layer selects it; clicking empty space clears the selection.\nMiddle- or right-button drag pans the whole watch face when enabled.\nWheel: when enabled, resize the selected element under the cursor; otherwise always zoom the whole watch face.\nSnapping aligns moved and transformed elements to the canvas and each other. Transform handles show eight resize points and a rotation arm. Operation status is shown only for long-running tasks.\nSpace + left button or Ctrl + left button temporarily pans the canvas; Ctrl + wheel always zooms the whole watch face.
