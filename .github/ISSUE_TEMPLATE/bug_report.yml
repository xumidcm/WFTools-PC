name: Bug report
description: 报告一个可复现的缺陷 / Report a reproducible defect
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索现有 issue，并确认这是最新 release 上的问题。
        安全问题请勿在此提交，见 [SECURITY.md](../blob/main/SECURITY.md)。
        **请勿上传有版权的表盘**，请用最小化的自制样本复现。

  - type: input
    id: version
    attributes:
      label: WFTools-PC 版本
      description: 在关于/设置中可见，或写清你用哪个 release 包
      placeholder: 0.1.6 (MSI)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows 11 x64
        - Windows 10 x64
        - Linux x64 (deb)
        - Linux x64 (portable)
        - 自行从源码构建
        - 其它
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 环境细节
      description: 系统版本、DPI 缩放、界面语言
      placeholder: Windows 11 23H2, 150% DPI, 简体中文
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量最小化；能附上自制样本 .watch 更好
      placeholder: |
        1. 打开 ...
        2. 选中图层 ...
        3. 拖动 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志、截图或样本
      description: 拖入图片即可。涉及文件损坏时请说明原文件是否仍可用
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认
      options:
        - label: 我已在最新 release 上复现该问题
          required: true
        - label: 我上传的素材不涉及第三方版权
          required: true
